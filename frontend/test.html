<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Java Editor</title>

  <!-- Monaco via CDN -->
  <script src="https://unpkg.com/monaco-editor@0.54.0/min/vs/loader.js"></script>

  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1e1e1e;
      color: white;
      font-family: sans-serif;
    }
    #editor {
      flex: 1;
      border-top: 1px solid #444;
    }
    #controls {
      padding: 8px;
      background: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    button {
      background: #007acc;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #005fa3; }
    pre {
      background: #111;
      color: #9f9;
      padding: 8px;
      border-radius: 4px;
      max-height: 150px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="controls">
    <span>Java Editor (Monaco)</span>
    <button id="runBtn">Esegui</button>
  </div>
  <div id="editor"></div>
  <pre id="output">Output…</pre>

  <script>
    // Configura Monaco
    require.config({ paths: { vs: "https://unpkg.com/monaco-editor@0.54.0/min/vs" } });
    require(["vs/editor/editor.main"], function () {
      const editor = monaco.editor.create(document.getElementById("editor"), {
        value: `class App {
  public static void main(String[] args) {
    System.out.println("Ciao mondo!");
  }
}`,
        language: "java",
        theme: "vs-dark",
        automaticLayout: true,
        fontSize: 14
      });

      const runBtn = document.getElementById("runBtn");
      const output = document.getElementById("output");

      runBtn.addEventListener("click", async () => {
        const code = editor.getValue();
        output.textContent = "Compilazione...";
        try {
          const res = await fetch("http://localhost:3010/run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              files: { "App.java": code },
              main: "App"
            })
          });
          const data = await res.json();
          if (!data.ok) {
            output.textContent = `[${data.phase} error]\n${data.stderr}`;
          } else {
            output.textContent = data.stdout || "(nessun output)";
          }
        } catch (e) {
          output.textContent = "Errore: " + e.message;
        }
      });
    });
  </script>
</body>
</html>
